[project]
name = "flightmon"
version = "0.1.0"
description = "Flight price monitor: scheduled Amadeus searches with Telegram alerts."
requires-python = ">=3.11"
dependencies = [
    "amadeus>=11.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0",
]

[project.scripts]
flightmon = "flightmon.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flightmon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
