name: flight-monitor

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "dashboard/**"
      - "data/searches.yaml"
      - ".github/workflows/flight-monitor.yml"

permissions:
  contents: write    # commit data updates back to the repo
  pages: write       # deploy dashboard
  id-token: write    # required by deploy-pages

concurrency:
  group: flight-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install backend
        working-directory: backend
        run: uv sync --frozen

      - name: Run flight monitor
        if: github.event_name != 'push'
        working-directory: backend
        env:
          AMADEUS_CLIENT_ID:     ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          AMADEUS_HOSTNAME:      ${{ vars.AMADEUS_HOSTNAME || 'test' }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          FLIGHTMON_REPO_ROOT:   ${{ github.workspace }}
        run: uv run python -m flightmon run

      - name: Commit data updates
        if: github.event_name != 'push'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): cron snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "$TARGET_BRANCH" && git push origin "HEAD:$TARGET_BRANCH" && break
            sleep $((i * 2))
          done

      - name: Assemble Pages artifact
        run: |
          set -e
          mkdir -p _site
          cp -r dashboard/. _site/
          mkdir -p _site/data
          if [ -f data/dashboard.json ]; then
            cp data/dashboard.json _site/data/dashboard.json
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
